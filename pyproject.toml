[project]
name = "intelligent-financial-qa-assistant"
version = "0.1.0"
description = "Evidence-first document QA agent for mixed financial PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
streamlit = [
  "pandas>=2.2.0",
  "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
